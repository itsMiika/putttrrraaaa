<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Putra Radi Ghaisan</title>
    <!-- Mengambil font keren dari Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            /* Background gradasi warna-warni yang cerah */
            background: linear-gradient(135deg, #FF9A8E 0%, #FF6A88 55%, #FF99AC 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 600px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            text-align: center;
            animation: fadeIn 1s ease-in-out;
        }

        .card-header {
            background: linear-gradient(135deg, #6583EC 0%, #35B7FF 100%);
            padding: 40px 20px;
            color: white;
            position: relative;
        }

        .avatar {
            width: 110px;
            height: 110px;
            background: #FFD166;
            border-radius: 50%;
            margin: 0 auto 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 45px;
            border: 4px solid #ffffff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card-header h1 {
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .card-header p {
            font-size: 15px;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            margin-top: 5px;
        }

        .card-body {
            padding: 30px;
        }

        .section-title {
            font-size: 18px;
            color: #333;
            margin-bottom: 15px;
            font-weight: 600;
            border-bottom: 2px dashed #eee;
            padding-bottom: 8px;
            text-align: left;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            margin-bottom: 25px;
            text-align: left;
        }

        .info-item {
            background: #F7F9FC;
            padding: 12px 18px;
            border-radius: 10px;
            border-left: 5px solid #FFD166;
            font-size: 14px;
            color: #555;
        }

        .info-item span {
            font-weight: 600;
            color: #333;
        }

        .hobi-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .hobi-badge {
            background: #E0F7FA;
            color: #00796B;
            padding: 10px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.3s;
        }

        .hobi-badge:nth-child(2) {
            background: #FFF3E0;
            color: #E65100;
        }

        .hobi-badge:hover {
            transform: translateY(-3px);
        }

        .footer {
            background: #FAFAFA;
            padding: 15px;
            font-size: 12px;
            color: #888;
            border-top: 1px solid #eee;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="avatar">👦</div>
            <h1>Putra Radi Ghaisan</h1>
            <p>Kelas 9.1</p>
        </div>

        <div class="card-body">
            <div class="section-title">📍 Informasi Pribadi</div>
            <div class="info-grid">
                <div class="info-item">
                    <span>Alamat Rumah:</span> Perumahan Taman Mahayu Sempidi
                </div>
            </div>

            <div class="section-title">⚡ Hobi & Minat</div>
            <div class="hobi-container">
                <div class="hobi-badge">🚴‍♂️ Bersepeda</div>
                <div class="hobi-badge">⚽ Bermain Bola</div>
            </div>
        </div>

        <div class="footer">
            Dibuat khusus dengan ❤️ menggunakan Notepad
        </div>
    </div>

</body>
</html>
